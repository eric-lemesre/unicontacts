[package]
name = "unicontacts-ffi"
description = "Interface étrangère d'unicontacts : le cœur et le connecteur CardDAV vus de Kotlin, par UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "unicontacts_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
thiserror = "2.0.21"
unicontacts-carddav = { version = "0.1.0", path = "../carddav" }
unicontacts-core = { version = "0.1.0", path = "../core" }
uniffi = { version = "0.32.2", features = ["cli"] }

# Mêmes lints que le workspace, à une exception près (ADR-0009) : le code
# qu'UniFFI génère contient de l'unsafe, qu'un « forbid » rendrait
# inadmissible. « deny » le laisse admettre là où le générateur le déclare ;
# le code écrit à la main dans ce crate n'en contient aucun.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
